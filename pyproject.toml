[project]
name = "pydantic-prism"
dynamic = ["version"]
description = "One canonical pydantic model, many scoped projections — with a relationship graph that survives them."
authors = [
    {name = "Ilja Orlovs",email = "IljaOrlovs@users.noreply.github.com"},
]
dependencies = ["pydantic>=2.12"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = [
    "pydantic",
    "schema",
    "projection",
    "scopes",
    "dto",
    "serialization",
    "validation",
    "json-schema",
    "fastapi",
    "data-classification",
    "pii",
    "code-generation",
    "type-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/release-art/pydantic-prism"
Documentation = "https://github.com/release-art/pydantic-prism/blob/main/docs/README.md"
Repository = "https://github.com/release-art/pydantic-prism"
Changelog = "https://github.com/release-art/pydantic-prism/blob/main/CHANGELOG.md"
Issues = "https://github.com/release-art/pydantic-prism/issues"

[project.scripts]
pydantic-prism = "pydantic_prism._internal.codegen:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
    "pyright>=1.1.410",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest-local-badge>=1.3.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

# Version comes from the git tag (the release workflow exports
# PDM_BUILD_SCM_VERSION="${GITHUB_REF_NAME#v}", which overrides the detected SCM
# version). A checkout with no tags falls back to 0.0.0.
[tool.pdm.version]
source = "scm"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+.*)$'
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "I",
    "W",
    "N",
    "C4",
    "T20",
    "PTH",
]
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "E402",
]
# The codegen CLI legitimately writes progress/errors to stdout/stderr.
"src/pydantic_prism/_internal/codegen/cli.py" = ["T201"]
# dev scripts print progress.
"bin/*.py" = ["T201"]
# Variables holding derived projection *classes* (UserPublic = User.scope(...))
# are CamelCase on purpose; examples print — that is their job.
"tests/**" = ["N806"]
"examples/**" = ["N806", "T201"]

[tool.ruff.lint.isort]
order-by-type = true
known-first-party = ["pydantic_prism"]
forced-separate = ["tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = """
    --cov --no-cov-on-fail
    -v -l --color=yes
    --local-badge-output-dir docs/badges/
    --cov-fail-under=100
    --local-badge-package=pydantic_prism
"""
