[project]
name = "pydantic-prism"
version = "0.1.0"
description = "Derive filtered subsets of pydantic models by tagging fields with role/visibility annotations, and keep cross-model references (id ↔ id) coherent across the projected views. One source-of-truth schema, many narrowed faces (API response, storage row, LLM tool-input, audit log) without hand-maintained parallel classes."
authors = [
    {name = "Ilja Orlovs",email = "IljaOrlovs@users.noreply.github.com"},
]
dependencies = ["pydantic>=2.12"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[project.scripts]
prism = "pydantic_prism._codegen:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
    "pyright>=1.1.410",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest-local-badge>=1.3.0",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "I",
    "W",
    "N",
    "C4",
    "T20",
    "PTH",
]
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "E402",
]
# The codegen CLI legitimately writes progress/errors to stdout/stderr.
"src/pydantic_prism/_codegen/_cli.py" = ["T201"]
# dev scripts print progress.
"bin/*.py" = ["T201"]
# Variables holding derived projection *classes* (UserPublic = User.scope(...))
# are CamelCase on purpose; examples print — that is their job.
"tests/**" = ["N806"]
"examples/**" = ["N806", "T201"]

[tool.ruff.lint.isort]
order-by-type = true
known-first-party = ["pydantic_prism"]
forced-separate = ["tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = """
    --cov --no-cov-on-fail
    -v -l --color=yes
    --local-badge-output-dir docs/badges/
    --cov-fail-under=100
    --local-badge-package=pydantic_prism
"""
