[project]
name = "pydantic-prism"
version = "0.1.0"
description = "Derive filtered subsets of pydantic models by tagging fields with role/visibility annotations, and keep cross-model references (id ↔ id) coherent across the projected views. One source-of-truth schema, many narrowed faces (API response, storage row, LLM tool-input, audit log) without hand-maintained parallel classes."
authors = [
    {name = "Ilja Orlovs",email = "IljaOrlovs@users.noreply.github.com"},
]
dependencies = ["pydantic>=2.7"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
    "pyright>=1.1.410",
    "fastapi>=0.115",
    "httpx>=0.27",
]
pytest-cov = [
    "pytest-local-badge>=1.3.0",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
